name: GoodsScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

# Fill in DEVELOPMENT_TEAM (your Apple team ID) and a unique PRODUCT_BUNDLE_IDENTIFIER
# before installing on a real device.
settings:
  base:
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.example.goodsscanner
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  BoxMeasureKit:
    path: Packages/BoxMeasureKit

targets:
  GoodsScanner:
    type: application
    platform: iOS
    sources: [GoodsScanner]
    dependencies:
      - package: BoxMeasureKit
    info:
      path: GoodsScanner/Info.plist
      properties:
        CFBundleDisplayName: 入库量方
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 用于扫描货物尺寸和拍摄入库照片
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    scheme:
      testTargets: [GoodsScannerTests]

  GoodsScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GoodsScannerTests]
    dependencies:
      - target: GoodsScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goodsscanner.tests
        GENERATE_INFOPLIST_FILE: YES

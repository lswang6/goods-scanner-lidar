name: GoodsScanner
options:
  bundleIdPrefix: com.louiswang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Translations: GoodsScanner/*.xcstrings, built from l10n/ by tools/l10n/build_catalog.py; xcodegen derives
  # knownRegions from the catalogs, so re-run it after a language is added.

# Fill in DEVELOPMENT_TEAM (your Apple team ID) and a unique PRODUCT_BUNDLE_IDENTIFIER
# before installing on a real device.
settings:
  base:
    DEVELOPMENT_TEAM: TX57ZT87FD
    PRODUCT_BUNDLE_IDENTIFIER: com.louiswang.goodsscanner
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  BoxMeasureKit:
    path: Packages/BoxMeasureKit

targets:
  GoodsScanner:
    type: application
    platform: iOS
    sources: [GoodsScanner]
    dependencies:
      - package: BoxMeasureKit
    info:
      path: GoodsScanner/Info.plist
      properties:
        CFBundleDisplayName: Cargo Measure
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Used to scan item dimensions and take inbound photos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false   # no networking / custom crypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    postBuildScripts:
      # SPEC §11 D5: Documents/ScanLogs visible in the Files app. Only Debug writes scan logs (DebugTools), so only
      # Debug gets the keys (INFOPLIST_KEY_UIFileSharingEnabled isn't supported, and the plist is shared).
      # Runs before code signing.
      - name: Debug file sharing
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]   # orders the script after Info.plist processing
        script: |
          [ "$CONFIGURATION" = Debug ] || exit 0
          P="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for k in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            /usr/libexec/PlistBuddy -c "Add :$k bool true" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$k true" "$P"
          done

  GoodsScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GoodsScannerTests]
    dependencies:
      - target: GoodsScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louiswang.goodsscanner.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GoodsScanner:
    build: { targets: { GoodsScanner: all } }
    run: { config: Debug }
    # Tests assert English export text; run them in en/US. Run keeps following the device language.
    test: { config: Debug, targets: [GoodsScannerTests], language: en, region: US }

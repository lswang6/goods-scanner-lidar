name: GoodsScanner
options:
  bundleIdPrefix: com.louiswang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Translations: GoodsScanner/*.xcstrings, built from l10n/ by tools/l10n/build_catalog.py; xcodegen derives
  # knownRegions from the catalogs, so re-run it after a language is added.

# Fill in DEVELOPMENT_TEAM (your Apple team ID) and a unique PRODUCT_BUNDLE_IDENTIFIER
# before installing on a real device.
settings:
  base:
    DEVELOPMENT_TEAM: TX57ZT87FD
    PRODUCT_BUNDLE_IDENTIFIER: com.louiswang.goodsscanner
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  BoxMeasureKit:
    path: Packages/BoxMeasureKit

targets:
  GoodsScanner:
    type: application
    platform: iOS
    sources: [GoodsScanner]
    dependencies:
      - package: BoxMeasureKit
    info:
      path: GoodsScanner/Info.plist
      properties:
        CFBundleDisplayName: Cargo Measure
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Used to scan item dimensions and take inbound photos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true          # SPEC §11 D5: Documents/ScanLogs visible in 文件 App
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  GoodsScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GoodsScannerTests]
    dependencies:
      - target: GoodsScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louiswang.goodsscanner.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GoodsScanner:
    build: { targets: { GoodsScanner: all } }
    run: { config: Debug }
    # Tests assert English export text; run them in en/US. Run keeps following the device language.
    test: { config: Debug, targets: [GoodsScannerTests], language: en, region: US }
